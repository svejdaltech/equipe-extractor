<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ meeting_title }} — rytter-tjekliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAE6DA;
    --surface: #F6F3EA;
    --surface-raised: #FFFFFF;
    --ink: #232620;
    --ink-muted: #6B6A5C;
    --ink-faint: #94927E;
    --line: #D9D2BE;
    --accent: #7B2D3A;
    --accent-ink: #7B2D3A;
    --accent-soft: #F1DEDF;
    --good: #3F6B44;
    --good-soft: #DCE7DB;
    --warn: #7A4E12;
    --warn-soft: #EFDFC0;
    --shadow: 0 1px 2px rgba(35,38,32,0.06);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16150F;
      --surface: #201F17;
      --surface-raised: #262418;
      --ink: #F0EBDD;
      --ink-muted: #ACA792;
      --ink-faint: #726E5C;
      --line: #38361F;
      --accent: #E08A94;
      --accent-ink: #E08A94;
      --accent-soft: #3A2229;
      --good: #90C793;
      --good-soft: #23331F;
      --warn: #E7B96A;
      --warn-soft: #3B2E14;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #16150F;
    --surface: #201F17;
    --surface-raised: #262418;
    --ink: #F0EBDD;
    --ink-muted: #ACA792;
    --ink-faint: #726E5C;
    --line: #38361F;
    --accent: #E08A94;
    --accent-ink: #E08A94;
    --accent-soft: #3A2229;
    --good: #90C793;
    --good-soft: #23331F;
    --warn: #E7B96A;
    --warn-soft: #3B2E14;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 46rem;
    margin: 0 auto;
    padding: 1.25rem 1.1rem 4rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a, button { font-family: inherit; }

  /* ---------- header ---------- */

  .topbar {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 1.1rem;
  }

  .eyebrow-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .eyebrow {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .clock {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .title {
    margin: 0.15rem 0 0;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 560;
    font-size: clamp(1.5rem, 5vw, 2rem);
    line-height: 1.12;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .note {
    margin: 0.35rem 0 0;
    font-size: 0.8rem;
    color: var(--ink-faint);
    max-width: 34rem;
    line-height: 1.5;
  }

  .progress-block {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .progress-text {
    font-size: 0.86rem;
    color: var(--ink-muted);
  }

  .progress-text strong {
    color: var(--ink);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .progress-sub {
    color: var(--ink-faint);
  }

  .progress-bar {
    height: 0.4rem;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--good);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .filter-toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.2rem;
    gap: 0.2rem;
  }

  .filter-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
  }

  .filter-btn.active {
    background: var(--surface-raised);
    color: var(--ink);
    box-shadow: var(--shadow);
  }

  .filter-btn:focus-visible, .export-btn:focus-visible, .sort-pill:focus-visible, .action-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .export-btn {
    appearance: none;
    display: inline-block;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent-ink);
    font-size: 0.82rem;
    font-weight: 700;
    padding: 0.45rem 0.85rem;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
  }

  .export-btn:hover { background: var(--accent-soft); }

  /* ---------- sort pills ---------- */

  .sort-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }

  .sort-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-faint);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }

  .sort-pill {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-muted);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.3rem 0.65rem;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }

  .sort-pill.active {
    border-color: var(--accent);
    color: var(--accent-ink);
    background: var(--accent-soft);
  }

  .sort-pill .arrow {
    font-size: 0.7rem;
  }

  /* ---------- rows ---------- */

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }

  .row {
    display: grid;
    grid-template-areas: "time class rider club status";
    grid-template-columns: 4.6rem 9.5rem 1fr 8rem 12rem;
    align-items: center;
    gap: 0.9rem;
    padding: 0.75rem 0.25rem;
    border-bottom: 1px solid var(--line);
  }

  .row.is-attention { background: color-mix(in srgb, var(--warn-soft) 55%, transparent); }

  .cell-time { grid-area: time; }
  .cell-class { grid-area: class; }
  .cell-rider { grid-area: rider; min-width: 0; }
  .cell-club { grid-area: club; min-width: 0; }
  .cell-status { grid-area: status; }

  .start-no {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    display: block;
  }

  .start-time {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.95rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .class-name {
    font-size: 0.78rem;
    color: var(--ink-muted);
    line-height: 1.3;
  }

  .rider-name {
    font-weight: 650;
    font-size: 0.95rem;
    line-height: 1.3;
  }

  .rider-name .count-tag {
    font-weight: 500;
    font-size: 0.72rem;
    color: var(--ink-faint);
    margin-left: 0.3rem;
  }

  .horse-name {
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin-top: 0.1rem;
  }

  .club-name {
    font-size: 0.82rem;
    color: var(--ink-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .status-tag {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.15rem 0.45rem;
    border-radius: 999px;
    margin-bottom: 0.35rem;
  }

  .status-tag.warn { background: var(--warn-soft); color: var(--warn); }

  .action-btn {
    appearance: none;
    width: 100%;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent-ink);
    font-size: 0.82rem;
    font-weight: 700;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
  }

  .action-btn:hover { background: var(--accent-soft); }
  .action-btn:disabled { opacity: 0.5; cursor: default; }

  .seen-pill {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--good-soft);
    color: var(--good);
    border-radius: 6px;
    padding: 0.4rem 0.55rem;
  }

  .seen-pill .mark {
    font-weight: 800;
  }

  .seen-text {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
    min-width: 0;
  }

  .seen-abs {
    font-size: 0.78rem;
    font-weight: 700;
  }

  .seen-elapsed {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    font-variant-numeric: tabular-nums;
    opacity: 0.85;
  }

  .remark-btn {
    margin-left: auto;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--good);
    font-size: 0.7rem;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
  }

  .empty-state {
    padding: 2.5rem 0.5rem;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.88rem;
  }

  /* ---------- mobile ---------- */

  @media (max-width: 640px) {
    .row {
      grid-template-areas:
        "time class"
        "rider rider"
        "club status"
        "action action";
      grid-template-columns: auto 1fr;
      row-gap: 0.3rem;
      padding: 0.85rem 0.15rem;
    }
    .cell-club { align-self: start; }
    .cell-status { grid-area: action; }
    .club-name { white-space: normal; }
  }

  /* ---------- toast ---------- */

  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.25rem;
    transform: translate(-50%, 0.5rem);
    background: var(--ink);
    color: var(--bg);
    font-size: 0.82rem;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 90vw;
    text-align: center;
    z-index: 10;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="eyebrow-row">
      <p class="eyebrow">Startliste{% if meeting_date %} · {{ meeting_date }}{% endif %}</p>
      <p class="clock" id="clock"></p>
    </div>
    <div>
      <h1 class="title">{{ meeting_title }}</h1>
      <p class="note">Tryk “Marker set” for at markere en rytter — det dækker alle deres starter i dette stævne, ikke kun den ene klasse.</p>
    </div>
    <div class="progress-block">
      <div class="progress-text">
        <strong id="seenCount">0</strong> af <strong id="totalCount">0</strong> ryttere set
        <span class="progress-sub">(<span id="rowSeenCount">0</span> af <span id="rowTotalCount">0</span> starter)</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="controls">
      <div class="filter-toggle" role="tablist" aria-label="Filtrér ryttere">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">Alle</button>
        <button class="filter-btn" data-filter="pending" role="tab" aria-selected="false">Mangler</button>
      </div>
      <a class="export-btn" href="/meetings/{{ meeting_id }}/export">Download Excel</a>
    </div>
  </header>

  <div class="sort-row">
    <span class="sort-label">Sortér</span>
    <button class="sort-pill active" data-key="startAt">Starttid <span class="arrow">↓</span></button>
    <button class="sort-pill" data-key="rider">Rytter <span class="arrow"></span></button>
    <button class="sort-pill" data-key="club">Klub <span class="arrow"></span></button>
    <button class="sort-pill" data-key="status">Status <span class="arrow"></span></button>
  </div>

  <ul class="list" id="rowsList"></ul>

  <div class="toast" id="toast"></div>
</div>

<script>
  var meetingId = {{ meeting_id }};
  var riders = {{ riders_json | safe }};
  var starts = {{ starts_json | safe }};
  var seenAt = {{ seen_at_json | safe }};

  var SOON_WINDOW_MS = 25 * 60 * 1000;

  var sortKey = "startAt";
  var sortDir = 1;
  var filter = "all";

  var rowsList = document.getElementById("rowsList");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  var ESCAPE_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value).replace(/[&<>"']/g, function (c) { return ESCAPE_MAP[c]; });
  }

  function fmtTime(iso) {
    var d = new Date(iso);
    return d.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
  }

  function fmtElapsed(ms) {
    var s = Math.floor(ms / 1000);
    if (s < 60) return "for " + s + " sek. siden";
    var m = Math.floor(s / 60);
    if (m < 60) return "for " + m + " min. siden";
    var h = Math.floor(m / 60);
    var remM = m % 60;
    return "for " + h + " t " + remM + " min. siden";
  }

  function riderEarliestStart(riderId) {
    var min = null;
    starts.forEach(function (s) {
      if (s.riderId === riderId && s.startAt) {
        var t = new Date(s.startAt).getTime();
        if (min === null || t < min) min = t;
      }
    });
    return min;
  }

  function riderStartCount(riderId) {
    return starts.filter(function (s) { return s.riderId === riderId; }).length;
  }

  function riderStatus(riderId) {
    if (seenAt[riderId]) return { key: "seen", rank: 0 };
    var earliest = riderEarliestStart(riderId);
    if (earliest === null) return { key: "upcoming", rank: 1 };
    var t = Date.now();
    if (earliest < t) return { key: "missed", rank: 3 };
    if (earliest - t <= SOON_WINDOW_MS) return { key: "soon", rank: 2 };
    return { key: "upcoming", rank: 1 };
  }

  function markSeen(riderId, btn) {
    if (btn) btn.disabled = true;
    fetch("/meetings/" + meetingId + "/riders/" + riderId + "/seen", { method: "POST" })
      .then(function (res) {
        if (!res.ok) throw new Error("request failed");
        return res.json();
      })
      .then(function (data) {
        seenAt[riderId] = data.photographed_at;
        var firstName = (riders[riderId] && riders[riderId].name || "Rytter").split(" ")[0];
        showToast(firstName + " markeret som set.");
        render();
      })
      .catch(function () {
        showToast("Kunne ikke gemme — prøv igen.");
        if (btn) btn.disabled = false;
      });
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  function statusCellHtml(row) {
    var st = riderStatus(row.riderId);
    if (st.key === "seen") {
      return (
        '<div class="seen-pill">' +
          '<span class="mark">✓</span>' +
          '<span class="seen-text">' +
            '<span class="seen-abs">Set kl. ' + fmtTime(seenAt[row.riderId]) + '</span>' +
            '<span class="seen-elapsed" data-seen-since="' + seenAt[row.riderId] + '">' + fmtElapsed(Date.now() - new Date(seenAt[row.riderId]).getTime()) + '</span>' +
          '</span>' +
          '<button class="remark-btn" data-remark="' + row.riderId + '">Marker igen</button>' +
        '</div>'
      );
    }
    var tag = "";
    if (st.key === "missed") tag = '<span class="status-tag warn">Ikke set · klasse slut</span>';
    else if (st.key === "soon") tag = '<span class="status-tag warn">Snart</span>';
    return (
      (tag ? '<div>' + tag + '</div>' : '') +
      '<button class="action-btn" data-mark="' + row.riderId + '">Marker set</button>'
    );
  }

  function render() {
    var rows = starts.map(function (s) {
      var r = riders[s.riderId] || {};
      return {
        riderId: s.riderId,
        name: r.name || "Ukendt rytter",
        club: r.club || null,
        horse: s.horse,
        startNo: s.startNo,
        classNo: s.classNo,
        className: s.className,
        startAt: s.startAt,
        status: riderStatus(s.riderId)
      };
    });

    if (filter === "pending") {
      rows = rows.filter(function (row) { return row.status.key !== "seen"; });
    }

    rows.sort(function (a, b) {
      var av, bv;
      if (sortKey === "startAt") { av = a.startAt ? new Date(a.startAt).getTime() : 0; bv = b.startAt ? new Date(b.startAt).getTime() : 0; }
      else if (sortKey === "rider") { av = a.name; bv = b.name; }
      else if (sortKey === "club") { av = a.club || "￿"; bv = b.club || "￿"; }
      else if (sortKey === "status") { av = a.status.rank; bv = b.status.rank; }
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });

    rowsList.innerHTML = "";

    if (!rows.length) {
      var empty = document.createElement("li");
      empty.className = "empty-state";
      empty.textContent = "Ingen ryttere matcher lige nu.";
      rowsList.appendChild(empty);
    }

    rows.forEach(function (row) {
      var li = document.createElement("li");
      li.className = "row" + (row.status.key === "missed" ? " is-attention" : "");
      var countTag = riderStartCount(row.riderId) > 1 ? '<span class="count-tag">(' + riderStartCount(row.riderId) + ' starter)</span>' : "";
      li.innerHTML =
        '<div class="cell-time"><span class="start-no">#' + escapeHtml(row.startNo || "") + '</span><span class="start-time">' + (row.startAt ? fmtTime(row.startAt) : "—") + '</span></div>' +
        '<div class="cell-class"><span class="class-name">Kl. ' + escapeHtml(row.classNo || "?") + ' · ' + escapeHtml(row.className || "") + '</span></div>' +
        '<div class="cell-rider"><div class="rider-name">' + escapeHtml(row.name) + countTag + '</div><div class="horse-name">' + escapeHtml(row.horse || "") + '</div></div>' +
        '<div class="cell-club"><span class="club-name">' + (row.club ? escapeHtml(row.club) : "—") + '</span></div>' +
        '<div class="cell-status">' + statusCellHtml(row) + '</div>';
      rowsList.appendChild(li);
    });

    var totalRiders = Object.keys(riders).length;
    var seenRiders = Object.keys(seenAt).filter(function (id) { return seenAt[id]; }).length;
    var totalRows = starts.length;
    var seenRows = starts.filter(function (s) { return seenAt[s.riderId]; }).length;

    document.getElementById("seenCount").textContent = seenRiders;
    document.getElementById("totalCount").textContent = totalRiders;
    document.getElementById("rowSeenCount").textContent = seenRows;
    document.getElementById("rowTotalCount").textContent = totalRows;
    document.getElementById("progressFill").style.width = (totalRiders ? Math.round((seenRiders / totalRiders) * 100) : 0) + "%";
  }

  function tickTimers() {
    document.querySelectorAll(".seen-elapsed").forEach(function (el) {
      var since = el.getAttribute("data-seen-since");
      if (since) el.textContent = fmtElapsed(Date.now() - new Date(since).getTime());
    });
    document.getElementById("clock").textContent = "nu " + new Date().toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  rowsList.addEventListener("click", function (e) {
    var markId = e.target.getAttribute("data-mark");
    var remarkId = e.target.getAttribute("data-remark");
    if (markId) markSeen(markId, e.target);
    if (remarkId) markSeen(remarkId, e.target);
  });

  document.querySelectorAll(".filter-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".filter-btn").forEach(function (b) { b.classList.remove("active"); b.setAttribute("aria-selected", "false"); });
      btn.classList.add("active");
      btn.setAttribute("aria-selected", "true");
      filter = btn.getAttribute("data-filter");
      render();
    });
  });

  document.querySelectorAll(".sort-pill").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var key = btn.getAttribute("data-key");
      if (key === sortKey) { sortDir *= -1; }
      else { sortKey = key; sortDir = 1; }
      document.querySelectorAll(".sort-pill").forEach(function (b) {
        b.classList.remove("active");
        b.querySelector(".arrow").textContent = "";
      });
      btn.classList.add("active");
      btn.querySelector(".arrow").textContent = sortDir === 1 ? "↓" : "↑";
      render();
    });
  });

  render();
  tickTimers();
  setInterval(tickTimers, 1000);
</script>
</body>
</html>
